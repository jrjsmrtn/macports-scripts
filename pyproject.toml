[project]
name = "mp-scripts"
version = "0.1.0"
description = "A collection of MacPorts-related scripts"
license = "MIT"
authors = [{ name = "Georges Martin", email = "jrjsmrtn@gmail.com" }]
requires-python = ">=3.14"

# Derived from the imports, not carried over from the Poetry list. Two were
# missing (parsimonious and PyYAML, both used by checksums2crate) and one was
# wrong: the `github` distribution is an unrelated async GitHub wrapper that
# installs a module of the same name as PyGithub's, so the two collided and
# whichever installed last won. The code uses PyGithub's synchronous Github.
dependencies = [
    "PyGithub>=2.5",
    "argcomplete>=3.1",
    "multidict>=6.1",
    "pandas>=2.2",
    "parsimonious>=0.10",
    "pyyaml>=6.0",
    "rich>=13.9",
    "sh>=2.1",
    "yarl>=1.18",
]

[project.scripts]
mp-check = "macports_scripts.mp_check:main"

[dependency-groups]
dev = [
    "ipython>=8.30",
    "pandas-stubs>=2.2",
    "pyfzf>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macports_scripts"]

[tool.ruff]
# Four of the five Python files here have no .py extension (mp-check, mp-fix-clt,
# checksums2crate, mp-commits-weekly). Ruff discovers only *.py and *.pyi by
# default, so without this it would lint one file out of five and report success.
# Verify with: ruff check --show-files .
extend-include = ["mp-check", "mp-fix-clt", "mp-commits-weekly", "checksums2crate"]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Starts at ruff's defaults (E4/E7/E9 + F) plus the rules that replace what
# prospector was nominally providing: bugbear, isort, pyupgrade, and flake8-bandit
# (S) which is what `prospector[with_bandit]` supplied.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Scripts legitimately shell out to port(1); S603/S607 are the subprocess rules.
# S606 covers the os.execv in the mp-check wrapper, which hands over to the
# project virtualenv with a fixed path and no shell.
"mp-*" = ["S603", "S606", "S607"]
"checksums2crate" = ["S603", "S607"]
